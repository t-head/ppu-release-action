name: Reusable Matrix Release

# 数组使用 JSON 字符串传参，镜像映射维护在 .github/scripts/prepare_matrix.py。
# 手动触发入口见 build.yml；本文件供本仓库及其他仓库通过 job 级 uses 调用。
# 跨仓库调用时，template_ref 必须与 uses 中的版本一致，推荐固定为 commit SHA。
# 私有模板仓库需允许跨仓库调用，并通过 template_token 提供模板代码的只读权限。
on:
  workflow_call:
    inputs:
      package_name:
        description: '构建和发布的包名，例如 deep-gemm；入口将 - 替换为 _，不参与矩阵展开'
        required: true
        type: string
      framework:
        description: '依赖的框架名称，例如 torch；不参与矩阵展开'
        required: true
        type: string
      python_versions:
        description: 'JSON 数组，候选值：38、310、312，例如 ["38","310"]'
        required: true
        type: string
        default: '["310"]'
      os_versions:
        description: 'JSON 数组，候选值：ubuntu2004、ubuntu2204、ubuntu2404、alios7u2'
        required: true
        type: string
        default: '["ubuntu2204"]'
      runtime_versions:
        description: 'JSON 数组，候选值：2、3，例如 ["2","3"]'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON 数组，候选值：2.8.0、2.10.0、2.13.0；[""] 表示不包含 Torch 版本'
        required: true
        type: string
        default: '["2.8.0"]'
      sdk_versions:
        description: 'JSON 数组，候选值：2.1.0、2.2.0'
        required: true
        type: string
        default: '["2.1.0"]'
      template_repository:
        description: '保存本工作流及 prepare_matrix.py 的仓库，格式为 owner/repo'
        type: string
        required: false
        default: t-head/release-action
      template_ref:
        description: '模板代码版本，必须与调用本工作流的 ref 一致；本仓库相对路径调用传 github.sha'
        required: true
        type: string
      build_command:
        description: '在调用方仓库根目录执行的 Bash 编译命令，支持多行；仅接受可信配置'
        required: true
        type: string
      tag_version:
        description: '可选发布版本，优先于仓库 tag，例如 1.0.0 或 V1.0.0+v0.3.0；所有版本来源均去除开头的 v/V，内部内容不变；须符合 PEP 440 及现有 tag 格式，非法值报错，含 rc（忽略大小写）仍跳过；不改变代码检出版本'
        required: false
        type: string
        default: ''
    secrets:
      template_token:
        description: '检出私有模板仓库的只读 token；同仓库或公开模板通常无需提供'
        required: false
      release_username:
        description: '发布用户名，来自调用方仓库或组织级 Actions Secret'
        required: true
      release_token:
        description: '发布 token，来自调用方仓库或组织级 Actions Secret'
        required: true
      data_token:
        description: '发布数据 Open API 客户端 RSA 私钥，Base64 编码的未加密 DER 格式'
        required: true

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: 校验输入并生成矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_release: ${{ steps.matrix.outputs.should_release }}
      package_name: ${{ steps.normalize-package.outputs.package_name }}
    steps:
      - name: 规范化包名
        id: normalize-package
        shell: bash
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          inputs = json.loads(os.environ["INPUTS_JSON"])
          package_name = inputs.get("package_name", "")
          if not isinstance(package_name, str) or not re.fullmatch(
              r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name
          ):
              raise SystemExit("::error::package_name 必须是合法的 Python 包名")
          package_name = package_name.replace("-", "_")
          inputs["package_name"] = package_name
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_name={package_name}\n")
              output.write("inputs_json=" + json.dumps(inputs, separators=(",", ":")) + "\n")
          PY

      # - name: 校验调用方组织
      #   shell: bash
      #   env:
      #     CALLER_ORGANIZATION: ${{ github.repository_owner }}
      #   run: |
      #     set -euo pipefail
      #     shopt -s nocasematch
      #     # 固定允许的组织，不能从调用方可修改的 input 中获取。
      #     if [[ "$CALLER_ORGANIZATION" != "t-head" ]]; then
      #       printf '%s\n' '::error::只允许 t-head 组织内的仓库调用此工作流' >&2
      #       exit 1
      #     fi

      - name: 检出调用方版本历史
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: caller-source
          fetch-depth: 0
          persist-credentials: false

      - name: 检出模板工具
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false
      - name: 配置矩阵校验 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装版本校验依赖
        shell: bash
        run: python3 -m pip install --no-input packaging

      - name: 解析版本数组和镜像映射
        id: matrix
        shell: bash
        env:
          INPUTS_JSON: ${{ steps.normalize-package.outputs.inputs_json }}
          SOURCE_DIR: caller-source
        run: python3 ci-template/.github/scripts/prepare_matrix.py

  build-sdist:
    name: 构建源码包
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出调用方仓库及完整版本历史
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: 检出源码包模板
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: 配置源码包构建 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装源码包构建依赖
        shell: bash
        run: python -m pip install --no-input setuptools wheel packaging

      - name: 填充模板并构建源码包
        shell: bash
        env:
          pkg_name: ${{ needs.prepare-matrix.outputs.package_name }}
          framework: ${{ inputs.framework }}
          MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          # 限制替换值，避免破坏 sed 表达式或生成的 Python 字符串。
          if [[ ! "$pkg_name" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]]; then
            printf '%s\n' '::error::package_name 必须是合法的 Python 包名' >&2
            exit 1
          fi
          if [[ -n "$framework" && ! "$framework" =~ ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
            printf '%s\n' '::error::framework 必须为空或合法的 Python 模块名' >&2
            exit 1
          fi

          # 直接使用矩阵的发布版本，先校验全部版本并去重，再逐个构建。
          release_versions="$(python - <<'PY'
          import json
          import os
          import re
          from packaging.version import InvalidVersion, Version

          try:
              entries = json.loads(os.environ["MATRIX_JSON"])["include"]
              if not isinstance(entries, list) or not entries:
                  raise ValueError
              versions = []
              for entry in entries:
                  version = entry["release_version"]
                  if not isinstance(version, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", version):
                      raise ValueError
                  Version(version)
                  if version not in versions:
                      versions.append(version)
          except (KeyError, TypeError, ValueError, InvalidVersion):
              raise SystemExit("::error::矩阵必须包含有效的 release_version")
          print("\n".join(versions))
          PY
          )"

          for placeholder in 'PACKAGE_NAME = ""' 'framework = ""' 'build_version = ""'; do
            if ! grep -Fxq "$placeholder" ci-template/.github/scripts/setup.py; then
              printf '%s\n' '::error::源码包模板缺少预期占位字段' >&2
              exit 1
            fi
          done

          # 每个版本使用独立构建目录，避免模板及 egg-info 串用；产物统一收集。
          mkdir -p sdist/dist
          dist_dir="$(pwd)/sdist/dist"
          export __FAKE_BUILD="FAKE_WHEEL"
          while IFS= read -r build_version; do
            build_dir="sdist/builds/$build_version"
            mkdir -p "$build_dir"
            sed \
              -e "s|^PACKAGE_NAME = \"\"$|PACKAGE_NAME = \"$pkg_name\"|" \
              -e "s|^framework = \"\"$|framework = \"$framework\"|" \
              -e "s|^build_version = \"\"$|build_version = \"$build_version\"|" \
              ci-template/.github/scripts/setup.py > "$build_dir/setup.py"
            (cd "$build_dir" && python setup.py sdist --dist-dir "$dist_dir")
            printf '已构建源码包版本：%s\n' "$build_version"
          done <<< "$release_versions"

      - name: 保存源码包构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-sdist
          path: sdist/dist/*.tar.gz
          if-no-files-found: error

  matrix-job:
    name: py${{ matrix.python_version }} / ${{ matrix.os_version }} / runtime${{ matrix.runtime_version }} / torch${{ matrix.torch_version }} / sdk${{ matrix.sdk_version }}
    needs: [prepare-matrix, build-sdist]
    # job 条件先于矩阵展开，跳过时不解析空的 matrix output，也不启动编译容器。
    if: ${{ needs.prepare-matrix.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      OS_VERSION: ${{ matrix.os_version }}
      RUNTIME_VERSION: ${{ matrix.runtime_version }}
      TORCH_VERSION: ${{ matrix.torch_version }}
      SDK_VERSION: ${{ matrix.sdk_version }}
      RELEASE_VERSION: ${{ matrix.release_version }}
      WHL_NAME: ${{ matrix.whl_name }}
      CONTAINER_IMAGE: ${{ matrix.image }}
      TORCH_URL: ${{ matrix.torch_url }}
      SDK_URL: ${{ matrix.sdk_url }}
    defaults:
      run:
        shell: sh
    steps:
      - name: 输出当前矩阵参数
        run: |
          printf '%s\n' \
            "PYTHON_VERSION=$PYTHON_VERSION" \
            "OS_VERSION=$OS_VERSION" \
            "RUNTIME_VERSION=$RUNTIME_VERSION" \
            "TORCH_VERSION=$TORCH_VERSION" \
            "SDK_VERSION=$SDK_VERSION" \
            "RELEASE_VERSION=$RELEASE_VERSION" \
            "WHL_NAME=$WHL_NAME" \
            "TORCH_URL=$TORCH_URL" \
            "SDK_URL=$SDK_URL" \
            "CONTAINER_IMAGE=$CONTAINER_IMAGE"
      # - name: 安装 SDK 和 Torch
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     : "${SDK_URL:?SDK_URL 为空，请先实现 SDK 下载地址查询}"
      #     : "${TORCH_URL:?TORCH_URL 为空，请先实现 Torch 下载地址查询}"

      #     # 保留 wheel 的版本和兼容性标签，并处理 URL 查询参数及百分号编码。
      #     torch_wheel="$(python3 -c 'import os, posixpath; from urllib.parse import unquote, urlsplit; print(posixpath.basename(unquote(urlsplit(os.environ["TORCH_URL"]).path)))')"
      #     if [[ ! "$torch_wheel" =~ ^torch-[a-zA-Z0-9_.+-]+\.whl$ ]]; then
      #       printf '%s\n' '::error::TORCH_URL 路径必须包含有效的 torch-*.whl 文件名' >&2
      #       exit 1
      #     fi

      #     download_dir="$(mktemp -d)"
      #     curl --fail --show-error --location --retry 3 --connect-timeout 30 \
      #       --proto '=http,https' --proto-redir '=http,https' \
      #       --output "$download_dir/ppu-sdk.run" -- "$SDK_URL"
      #     curl --fail --show-error --location --retry 3 --connect-timeout 30 \
      #       --proto '=http,https' --proto-redir '=http,https' \
      #       --output "$download_dir/$torch_wheel" -- "$TORCH_URL"

      #     bash "$download_dir/ppu-sdk.run" --prefix=/usr/local/ --silent
      #     ln -sf /usr/local/PPU_SDK/CUDA_SDK /usr/local/cuda
      #     source /usr/local/PPU_SDK/envsetup.sh
      #     echo "NCCL_INCLUDE_DIR=${CUDA_PATH}/include" >> "$GITHUB_ENV"
      #     echo "NCCL_LIB_DIR=${CUDA_PATH}/lib64" >> "$GITHUB_ENV"
      #     python3 -m pip install --no-input "$download_dir/$torch_wheel"
      # 默认检出调用方仓库及其触发版本，不是模板仓库。
      - name: 检出待编译仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: 编译
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -eo pipefail
          : "${BUILD_COMMAND:?build_command 不能为空}"
          source /usr/local/PPU_SDK/envsetup.sh
          bash -e -o pipefail -c "$BUILD_COMMAND"

      - name: 收集 wheel 到 dist
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path.cwd()
          dist = root / "dist"
          package_name = os.environ["PACKAGE_NAME"].lower().replace("-", "_")
          if not package_name:
              raise SystemExit("::error::package_name 不能为空")
          if dist.is_symlink() or (dist.exists() and not dist.is_dir()):
              raise SystemExit("::error::dist 必须是普通目录，不能是符号链接")

          def scan_error(error):
              raise SystemExit(f"::error::无法扫描源码目录：{error}")

          # 递归查找普通文件，不跟随符号链接；先完成筛选，避免同名产物复制时互相覆盖。
          wheels = []
          for directory, _, filenames in os.walk(root, onerror=scan_error, followlinks=False):
              for filename in filenames:
                  path = Path(directory) / filename
                  if filename.endswith(".whl") and path.is_file() and not path.is_symlink():
                      wheels.append(path)
          wheels.sort()
          print("发现 wheel 文件：" + json.dumps([str(path.relative_to(root)) for path in wheels],
                                               ensure_ascii=False), flush=True)
          if not wheels:
              raise SystemExit("::error::源码目录中未找到 .whl 文件")
          candidates = wheels
          if len(wheels) > 1:
              candidates = [path for path in wheels
                            if path.name.lower().replace("-", "_").startswith(package_name)]
          if len(candidates) != 1:
              raise SystemExit(f"::error::按 package_name 筛选后必须且只能有一个 wheel，实际为 {len(candidates)} 个")

          selected = candidates[0]
          target = dist / selected.name
          existing = list(dist.glob("*.whl"))
          if any(path.is_symlink() or not path.is_file() for path in existing):
              raise SystemExit("::error::dist 中的 wheel 必须是普通文件，不能是符号链接")
          if selected != target and target.exists():
              raise SystemExit("::error::dist 中已存在同名产物，拒绝覆盖")
          dist.mkdir(exist_ok=True)
          # 仅匹配时归一化名称，复制保留原名；已在 dist 中的选中产物无需复制。
          if selected != target:
              shutil.copy2(selected, target)
          # dist 只保留选中的 wheel，源码其他目录中的原件和非 wheel 文件不变。
          for path in existing:
              if path != target:
                  path.unlink()
          print("已收集 wheel：" + json.dumps(str(target.relative_to(root)), ensure_ascii=False))
          PY

      # Docker action 与编译容器共享工作区，在指定工具镜像内完成重打包。
      - name: Repack wheel
        uses: docker://download.t-head.cn/docker_tool/manylinux_revpkg:04
        with:
          entrypoint: /bin/bash
          args: |
            -euo pipefail -c "
            : \"${RELEASE_VERSION:?RELEASE_VERSION 不能为空}\"
            shopt -s nullglob
            wheels=(dist/*.whl)
            if (( ${#wheels[@]} != 1 )); then
              printf '%s\n' '::error::重打包前 dist 目录必须包含且仅包含一个 wheel 文件' >&2
              printf '%s\n' 'dist 目录文件列表（含隐藏文件）：' >&2
              ls -la -- dist >&2 || true
              exit 1
            fi
            wheel=\"${wheels[0]}\"
            if [[ ! -f \"$wheel\" || -L \"$wheel\" ]]; then
              printf '%s\n' '::error::待重打包的 wheel 必须是普通文件，不能是符号链接' >&2
              exit 1
            fi

            mkdir -p /tmp/origin /tmp/release
            existing=(/tmp/release/*.whl)
            if (( ${#existing[@]} != 0 )); then
              printf '%s\n' '::error::重打包输出目录已存在 wheel 文件' >&2
              exit 1
            fi
            WHEEL_FILE=\"${wheel##*/}\"
            cp -- \"$wheel\" \"/tmp/origin/$WHEEL_FILE\"
            revpkg --input \"/tmp/origin/${WHEEL_FILE}\" --output /tmp/release --new-version \"${RELEASE_VERSION}\"

            repacked=(/tmp/release/*.whl)
            if (( ${#repacked[@]} != 1 )); then
              printf '%s\n' '::error::重打包后必须生成且仅生成一个 wheel 文件' >&2
              exit 1
            fi
            if [[ ! -f \"${repacked[0]}\" || -L \"${repacked[0]}\" || ! -s \"${repacked[0]}\" ]]; then
              printf '%s\n' '::error::重打包产物必须是非空普通 wheel 文件，不能是符号链接' >&2
              exit 1
            fi
            # 保留编译产物的原始文件名，下一步再按矩阵要求重命名。
            cp -- \"${repacked[0]}\" \"$wheel\"
            printf '已重打包 wheel：%s\n' \"$wheel\"
            "

      - name: 重命名 wheel
        shell: bash
        run: |
          set -euo pipefail
          : "${WHL_NAME:?WHL_NAME 不能为空}"
          if [[ ! "$WHL_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.+!-]*\.whl$ ]]; then
            printf '%s\n' '::error::WHL_NAME 必须是 wheel 文件名，不能包含路径或特殊字符' >&2
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            printf '%s\n' '::error::重打包后 dist 目录必须包含且仅包含一个 wheel 文件' >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          target="dist/$WHL_NAME"
          if [[ ! -f "$wheel" || -L "$wheel" ]]; then
            printf '%s\n' '::error::待重命名的 wheel 必须是普通文件，不能是符号链接' >&2
            exit 1
          fi
          # 仅重命名文件，不修改 wheel 内部元数据；已是目标名称时直接保留。
          if [[ "$wheel" != "$target" ]]; then
            if [[ -e "$target" || -L "$target" ]]; then
              printf '%s\n' '::error::目标 wheel 已存在，拒绝覆盖' >&2
              exit 1
            fi
            mv -- "$wheel" "$target"
          fi
          printf 'wheel 产物：%s\n' "$target"

      - name: 上传 wheel 到 Artifactory
        shell: bash
        env:
          ARTIFACTORY_URL: https://download.t-head.cn/artifactory/pypi_generic/
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: |
          set -euo pipefail
          : "${RELEASE_USERNAME:?发布用户名不能为空}"
          : "${RELEASE_TOKEN:?发布 token 不能为空}"
          : "${RELEASE_VERSION:?RELEASE_VERSION 不能为空}"
          : "${WHL_NAME:?WHL_NAME 不能为空}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            printf '%s\n' '::error::dist 目录中未找到 wheel 文件' >&2
            exit 1
          fi

          # 先校验全部文件及目标路径，再发送带凭据的上传请求。
          upload_urls=()
          for wheel in "${wheels[@]}"; do
            if [[ ! -f "$wheel" || -L "$wheel" ]]; then
              printf '%s\n' '::error::上传产物必须是普通 wheel 文件，不能是符号链接' >&2
              exit 1
            fi
            upload_url="$(python3 - "$wheel" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import quote

          filename = Path(sys.argv[1]).name
          match = re.fullmatch(
              r"(?P<name>[A-Za-z0-9_][A-Za-z0-9_.]*)-"
              r"(?P<version>[0-9][A-Za-z0-9.!+_]*)-"
              r"(?:[0-9][A-Za-z0-9_.]*-)?"
              r"[A-Za-z0-9_.]+-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+\.whl",
              filename,
          )
          if match is None:
              raise SystemExit("::error::wheel 文件名格式不合法")
          package_name = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name):
              raise SystemExit("::error::package_name 必须是合法的 Python 包名")
          normalize = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          if normalize(match["name"]) != normalize(package_name):
              raise SystemExit("::error::wheel 包名与 package_name 不一致")
          release_version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", release_version):
              raise SystemExit("::error::RELEASE_VERSION 必须是合法的版本目录名，不能包含路径或特殊字符")
          whl_name = os.environ["WHL_NAME"]
          if filename != whl_name:
              raise SystemExit("::error::上传 wheel 文件名与 WHL_NAME 不一致")
          components = (package_name, release_version, whl_name)
          print(os.environ["ARTIFACTORY_URL"].rstrip("/") + "/" + "/".join(quote(part, safe="") for part in components))
          PY
          )"
            upload_urls+=("$upload_url")
          done

          # 上传路径为包名/release_version/whl_name，构建方需保证不同矩阵配置的 wheel 文件名不冲突。
          for index in "${!wheels[@]}"; do
            wheel="${wheels[$index]}"
            # 不跟随重定向，避免向其他地址发送产物或发布凭据。
            status="$(curl --fail --silent --show-error --retry 3 \
              --connect-timeout 30 --max-time 600 --proto '=https' \
              --user "$RELEASE_USERNAME:$RELEASE_TOKEN" \
              --upload-file "$wheel" --output /dev/null --write-out '%{http_code}' \
              -- "${upload_urls[$index]}")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
              printf '%s\n' "::error::Artifactory 上传失败，HTTP 状态码：$status" >&2
              exit 1
            fi
            printf '已上传 %s\n' "${wheel##*/}"
          done

      - name: 保存 GitHub Release wheel 产物
        # 指定版本已通过矩阵校验和 rc 门禁，分支触发时也保存发布产物。
        if: ${{ inputs.tag_version != '' || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-release-wheels-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0

      - name: 生成发布数据 JSON
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
          MATRIX_INDEX: ${{ strategy.job-index }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          matrix = json.loads(os.environ["MATRIX_JSON"])
          package_name = os.environ["PACKAGE_NAME"]
          data = {
              "artifactName": package_name,
              "sdkVersion": matrix["sdk_version"],
              "item": package_name,
              "osTypeList": matrix["os_version"],
              "runtimeVersion": matrix["runtime_version"],
              "framework": matrix["torch_version"],
              "python": matrix["python_version"],
              "tag": matrix["tag"],
          }
          index = os.environ["MATRIX_INDEX"]
          if not re.fullmatch(r"[0-9]+", index):
              raise SystemExit("::error::矩阵索引必须是非负整数")
          # 文件名包含矩阵索引，便于最后合并下载时保留每个成功任务的数据。
          output = Path(os.environ["RUNNER_TEMP"]) / "release-data" / f"release-{index}.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          with output.open("x", encoding="utf-8") as target:
              target.write(content)
          print(content, end="")
          PY

      - name: 保存发布数据 JSON
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-release-data-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release-data/release-${{ strategy.job-index }}.json
          if-no-files-found: error

      - name: 记录矩阵任务成功
        shell: bash
        run: printf 'success\n' > "$RUNNER_TEMP/matrix-success.txt"

      - name: 保存矩阵任务成功标记
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-matrix-success-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/matrix-success.txt
          if-no-files-found: error

  publish-sdist:
    name: 至少一个矩阵任务成功后发布源码包
    needs: [prepare-matrix, build-sdist, matrix-job]
    # 即使矩阵汇总为 failure 也检查成功标记；取消、跳过或源码包构建失败时不发布。
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.build-sdist.result == 'success' && (needs.matrix-job.result == 'success' || needs.matrix-job.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - name: 下载本次运行尝试的成功标记
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare-matrix.outputs.package_name }}-matrix-success-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: matrix-results
          merge-multiple: false

      - name: 判断是否有矩阵任务成功
        id: matrix-success
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          any_success = any(
              path.is_file() and not path.is_symlink() and path.read_text(encoding="utf-8") == "success\n"
              for path in Path("matrix-results").glob("*/matrix-success.txt")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"any_success={str(any_success).lower()}\n")
          print("检测到成功任务，将发布源码包" if any_success else "没有成功的矩阵任务，跳过源码包发布")
          PY

      - name: 下载待发布源码包
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-matrix.outputs.package_name }}-sdist
          path: sdist-dist

      - name: 配置源码包发布 Python
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Twine
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        shell: bash
        run: python -m pip install --no-input twine

      - name: 上传源码包到 Artifactory
        id: publish
        if: ${{ steps.matrix-success.outputs.any_success == 'true' }}
        shell: bash
        env:
          ARTIFACTORY_URL: https://download.t-head.cn/artifactory/api/pypi/pypi_srcsupport/
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
          TWINE_USERNAME: ${{ secrets.release_username }}
          TWINE_PASSWORD: ${{ secrets.release_token }}
        run: |
          set -euo pipefail
          : "${TWINE_USERNAME:?发布用户名不能为空}"
          : "${TWINE_PASSWORD:?发布 token 不能为空}"
          shopt -s nullglob
          archives=(sdist-dist/*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            printf '%s\n' '::error::未找到待发布的源码包 tar.gz 文件' >&2
            exit 1
          fi
          # 所有产物与去重后的发布版本一一对应，全部校验通过后才开始上传。
          python3 - "${archives[@]}" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from packaging.utils import canonicalize_name, InvalidSdistFilename, parse_sdist_filename
          from packaging.version import InvalidVersion, Version

          package_name = os.environ["PACKAGE_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package_name):
              raise SystemExit("::error::package_name 必须是合法的 Python 包名")
          try:
              entries = json.loads(os.environ["MATRIX_JSON"])["include"]
              if not isinstance(entries, list) or not entries:
                  raise ValueError
              expected = set()
              for entry in entries:
                  version = entry["release_version"]
                  if not isinstance(version, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*", version):
                      raise ValueError
                  expected.add(Version(version))
          except (KeyError, TypeError, ValueError, InvalidVersion):
              raise SystemExit("::error::矩阵必须包含有效的 release_version")

          found = set()
          for filename in sys.argv[1:]:
              archive = Path(filename)
              if not archive.is_file() or archive.is_symlink():
                  raise SystemExit("::error::源码包必须是普通文件，不能是符号链接")
              if not archive.stat().st_size:
                  raise SystemExit("::error::源码包不能为空")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+!\-]*\.tar\.gz", archive.name):
                  raise SystemExit("::error::源码包文件名或版本不合法")
              try:
                  name, version = parse_sdist_filename(archive.name)
              except (InvalidSdistFilename, InvalidVersion):
                  raise SystemExit("::error::源码包文件名或版本不合法")
              if name != canonicalize_name(package_name):
                  raise SystemExit("::error::源码包包名与 package_name 不一致")
              if version not in expected or version in found:
                  raise SystemExit("::error::源码包版本不在矩阵中或重复")
              found.add(version)
          if found != expected:
              raise SystemExit("::error::源码包缺少矩阵中的 release_version")
          PY

          for archive in "${archives[@]}"; do
            twine upload --repository-url "$ARTIFACTORY_URL" \
              --verbose --disable-progress-bar --non-interactive "$archive"
            printf '已上传源码包 %s\n' "${archive##*/}"
          done

  update-metadata:
    name: Update metadata
    needs: [prepare-matrix, publish-sdist]
    # 允许部分 wheel 失败后的成功发布；源码包未实际上传、失败或取消时均不更新。
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.publish-sdist.result == 'success' && needs.publish-sdist.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出元数据工具
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: 配置元数据更新 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装元数据依赖
        shell: bash
        run: python -m pip install --no-input requests packaging

      - name: 生成并上传 index.json
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          RELEASE_USERNAME: ${{ secrets.release_username }}
          RELEASE_TOKEN: ${{ secrets.release_token }}
        run: python ci-template/.github/scripts/get_metadata.py

  post-release-data:
    name: 推送发布数据
    needs: [prepare-matrix, update-metadata]
    # 元数据成功更新后才推送；显式状态函数允许部分矩阵失败的发布流程继续。
    if: ${{ !cancelled() && needs.prepare-matrix.outputs.should_release == 'true' && needs.update-metadata.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下载本次运行尝试的发布数据
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare-matrix.outputs.package_name }}-release-data-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-data
          merge-multiple: true

      - name: 检出发布数据工具
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.template_repository }}
          ref: ${{ inputs.template_ref }}
          path: ci-template
          token: ${{ secrets.template_token || github.token }}
          persist-credentials: false

      - name: 配置发布数据 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装发布数据依赖
        shell: bash
        run: python -m pip install --no-input requests cryptography

      - name: 逐个推送发布数据
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.prepare-matrix.outputs.package_name }}
          CLIENT_PRIVATE_KEY_B64: ${{ secrets.data_token }}
        run: python ci-template/.github/scripts/post_data.py --input-dir release-data
